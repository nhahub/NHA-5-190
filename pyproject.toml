[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wardiq"
version = "0.1.0"
description = "WARDIQ clothing understanding and outfit recommendation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "pyarrow>=15,<23", "Pillow>=10,<13", "PyYAML>=6,<7"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "torch>=2.2", "torchvision>=0.17", "transformers>=4.40,<6"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
