[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wardiq"
version = "0.1.0"
description = "WARDIQ clothing understanding and outfit recommendation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "pyarrow>=15,<26", "Pillow>=10,<13", "PyYAML>=6,<7"]
color = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "threadpoolctl>=3,<4", "Pillow>=10,<13", "PyYAML>=6,<7"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "torch>=2.2", "torchvision>=0.17", "transformers>=4.40,<6"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Focus the baseline on shared package code and the executable validation entry points.
# Historical research scripts are reviewed for portability in Phase 3 before expansion.
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/wardiq"]
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
