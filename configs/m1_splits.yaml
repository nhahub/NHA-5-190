random_seed: 42
fashion_mnist:
  method: stratified_random_split
  validation_fraction: 0.1
  stratify_by: category_labels
  preserve_official_test: true
fashionpedia:
  method: official_source_split
  provided_splits:
  - validation
  preserve_official_splits: true
  public_test_labels_available: false
  use_test_for_model_selection: false
  limitation: The current raw manifest contains validation records only. No missing
    train/test records were inferred.
polyvore_outfits:
  method: official_disjoint_validation
  provided_splits:
  - disjoint validation
  split_unit: outfit
  do_not_split_rows_randomly: true
  limitation: The current raw manifest contains disjoint validation records only.
    No missing train/test records were inferred.
